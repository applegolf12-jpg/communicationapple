<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex, nofollow">
<title>관리자 | 커뮤니케이션 애플</title>
<link rel="icon" href="../img/38b7d85e32bc.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Archivo:wght@800&amp;family=Noto+Sans+KR:wght@400;500;700;900&amp;display=swap" rel="stylesheet">
<style>
*{box-sizing:border-box}[hidden]{display:none!important}
:root{--g:#1F4D3F;--gd:#0E2A21;--ink:#141A17;--mute:#5A645F;--line:#E1E6E2;--bg:#F4F6F3}
body{margin:0;background:var(--bg);font-family:'Noto Sans KR',sans-serif;color:var(--ink);font-size:14px}
a{color:var(--g)}
button,input,select,textarea{font-family:inherit;font-size:14px;color:var(--ink)}
input,select,textarea{border:1.5px solid #C4CCC7;border-radius:8px;padding:9px 11px;background:#fff;min-height:40px}
input:focus,select:focus,textarea:focus,button:focus-visible{outline:2px solid var(--g);outline-offset:1px}
label{font-size:13px;font-weight:700}
.btn{min-height:40px;padding:0 16px;border-radius:8px;border:1.5px solid var(--g);background:var(--g);color:#fff;font-weight:700;cursor:pointer;white-space:nowrap}
.btn.ghost{background:#fff;color:var(--ink);border-color:#C4CCC7}.btn.danger{background:#fff;color:#B3261E;border-color:#E3B4B0}
.btn:disabled{opacity:.55;cursor:default}
/* login */
#login{min-height:100vh;display:flex;align-items:center;justify-content:center;padding:24px}
#login form{width:min(400px,100%);background:#fff;border-radius:20px;padding:32px;display:flex;flex-direction:column;gap:14px;box-shadow:0 10px 40px rgba(14,42,33,.08)}
.f{display:flex;flex-direction:column;gap:6px}
.msg{margin:0;font-weight:700;font-size:13px;line-height:1.6}.msg.e{color:#B3261E}.msg.o{color:#1F6B45}
/* shell */
.top{background:var(--gd);color:#fff;display:flex;align-items:center;justify-content:space-between;gap:16px;padding:0 24px;min-height:60px;position:sticky;top:0;z-index:20}
.top b{font-family:'Archivo',sans-serif;letter-spacing:.02em;font-size:16px}
.top .who{display:flex;align-items:center;gap:12px;font-size:13px;color:#C9DAD1}
.top .btn.ghost{min-height:34px;background:transparent;color:#fff;border-color:#4C6F62}
nav.tabs{display:flex;gap:4px;padding:0 24px;background:#fff;border-bottom:1px solid var(--line);overflow-x:auto;position:sticky;top:60px;z-index:19}
nav.tabs button{border:none;background:none;padding:16px 14px;font-weight:700;color:var(--mute);cursor:pointer;border-bottom:3px solid transparent;white-space:nowrap}
nav.tabs button[aria-selected=true]{color:var(--ink);border-bottom-color:var(--g)}
nav.tabs .cnt{display:inline-block;min-width:20px;padding:1px 6px;margin-left:6px;border-radius:999px;background:#B3261E;color:#fff;font-size:11px}
main{max-width:1400px;margin:0 auto;padding:24px}
.panel{display:flex;flex-direction:column;gap:18px}
.card{background:#fff;border-radius:16px;padding:20px;border:1px solid var(--line)}
.card h2{margin:0 0 14px;font-size:16px;font-weight:900}
.kpis{display:grid;grid-template-columns:repeat(auto-fit,minmax(180px,1fr));gap:12px}
.kpi{background:#fff;border:1px solid var(--line);border-radius:16px;padding:18px 20px;display:flex;flex-direction:column;gap:6px}
.kpi span{font-size:12px;color:var(--mute);font-weight:700}.kpi b{font-size:26px;font-weight:900}.kpi small{color:var(--mute)}
.bar{display:flex;flex-wrap:wrap;gap:8px;align-items:flex-end}
.bar .f{min-width:120px}
.tw{overflow-x:auto}
table{width:100%;border-collapse:collapse}
th,td{padding:10px 10px;border-bottom:1px solid var(--line);text-align:left;vertical-align:middle;white-space:nowrap}
th{font-size:12px;color:var(--mute);font-weight:700;background:#FAFBFA;position:sticky;top:0}
td.num,th.num{text-align:right;font-variant-numeric:tabular-nums}
tbody tr.click{cursor:pointer}tbody tr.click:hover{background:#F5F8F6}
tfoot td{font-weight:900;background:#FAFBFA}
.sub{color:var(--mute);font-size:12px}
.st{display:inline-block;padding:3px 10px;border-radius:999px;font-size:12px;font-weight:700;background:#EEF1EE;color:#3E4843}
.st[data-s=신청접수],.st[data-s=신규]{background:#FDE7E4;color:#9A2B22}
.st[data-s=결제안내],.st[data-s=연락완료],.st[data-s=견적진행]{background:#FFF4D6;color:#7A5300}
.st[data-s=입금확인]{background:#E2EEFF;color:#1C4E9A}
.st[data-s=예약확정],.st[data-s=계약]{background:#DDF1E5;color:#1F6B45}
.st[data-s=취소],.st[data-s=종료]{background:#ECEDEC;color:#6B716E}
.meter{height:8px;border-radius:99px;background:#E7ECE9;overflow:hidden;min-width:90px}.meter i{display:block;height:100%;background:var(--g)}
.meter i.full{background:#B3261E}
.empty{padding:28px;text-align:center;color:var(--mute)}
dialog{border:none;border-radius:20px;padding:0;width:min(640px,calc(100vw - 24px));max-height:calc(100vh - 40px)}
dialog::backdrop{background:rgba(14,42,33,.45)}
.dlg{display:flex;flex-direction:column;gap:14px;padding:24px}
.dlg h3{margin:0;font-size:18px;font-weight:900}
.kv{display:grid;grid-template-columns:110px 1fr;gap:8px 12px;font-size:14px;line-height:1.6}
.kv dt{color:var(--mute);font-weight:700}.kv dd{margin:0;white-space:pre-wrap;word-break:break-all}
.grid2{display:grid;grid-template-columns:repeat(auto-fit,minmax(160px,1fr));gap:12px}
.acts{display:flex;flex-wrap:wrap;gap:8px;justify-content:space-between}
.sms{background:#F4F6F3;border-radius:12px;padding:14px;display:flex;flex-direction:column;gap:8px}
.sms textarea{min-height:120px;font-size:13px;line-height:1.6}
.toast{position:fixed;left:50%;bottom:24px;transform:translateX(-50%);background:var(--gd);color:#fff;padding:12px 20px;border-radius:10px;font-weight:700;z-index:99}
</style>
</head>
<body>
<div id="boot" class="empty" style="padding-top:120px">불러오는 중…</div>

<div id="login" hidden>
<form novalidate>
<b style="font-family:'Archivo',sans-serif;font-size:18px">COMMUNICATION APPLE</b>
<h1 style="margin:0;font-size:22px;font-weight:900">관리자 로그인</h1>
<div class="f"><label for="lg-e">이메일</label><input id="lg-e" type="email" autocomplete="username"></div>
<div class="f"><label for="lg-p">비밀번호</label><input id="lg-p" type="password" autocomplete="current-password"></div>
<p id="lg-m" class="msg e" role="alert" hidden></p>
<button class="btn" type="submit" style="min-height:48px">로그인</button>
<p class="sub" style="margin:0;line-height:1.6">관리자 권한이 있는 계정만 들어올 수 있습니다.</p>
</form>
</div>

<div id="app" hidden>
<header class="top"><b>COMMUNICATION APPLE · 관리자</b><div class="who"><span id="who"></span><a href="../" style="color:#C9DAD1">사이트 보기</a><button class="btn ghost" id="out" type="button">로그아웃</button></div></header>
<nav class="tabs" role="tablist" aria-label="관리 메뉴">
<button role="tab" data-t="dash" aria-selected="true">대시보드</button>
<button role="tab" data-t="apps">아카데미 신청<span class="cnt" id="c-apps" hidden></span></button>
<button role="tab" data-t="sess">차수별 현황</button>
<button role="tab" data-t="inq">행사 문의<span class="cnt" id="c-inq" hidden></span></button>
<button role="tab" data-t="mem">회원</button>
</nav>
<main>
<section class="panel" id="t-dash"></section>

<section class="panel" id="t-apps" hidden>
<div class="card">
<div class="bar">
<div class="f"><label for="fa-place">장소</label><select id="fa-place"><option value="">전체</option><option>칸차나부리</option><option>아마타</option></select></div>
<div class="f"><label for="fa-sess">차수</label><select id="fa-sess"><option value="">전체</option></select></div>
<div class="f"><label for="fa-pro">프로</label><select id="fa-pro"><option value="">전체</option></select></div>
<div class="f"><label for="fa-st">상태</label><select id="fa-st"><option value="">전체</option><option>신청접수</option><option>결제안내</option><option>입금확인</option><option>예약확정</option><option>취소</option></select></div>
<div class="f" style="flex:1 1 180px"><label for="fa-q">검색</label><input id="fa-q" type="search" placeholder="이름·전화번호·동반자"></div>
<button class="btn ghost" id="fa-csv" type="button">엑셀(CSV) 받기</button>
<button class="btn ghost" id="reload1" type="button">새로고침</button>
</div>
</div>
<div class="card" style="padding:0"><div class="tw" id="apps-tbl"></div></div>
</section>

<section class="panel" id="t-sess" hidden></section>

<section class="panel" id="t-inq" hidden>
<div class="card"><div class="bar">
<div class="f"><label for="fi-st">상태</label><select id="fi-st"><option value="">전체</option><option>신규</option><option>연락완료</option><option>견적진행</option><option>계약</option><option>종료</option></select></div>
<div class="f" style="flex:1 1 200px"><label for="fi-q">검색</label><input id="fi-q" type="search" placeholder="이름·회사·연락처·내용"></div>
<button class="btn ghost" id="fi-csv" type="button">엑셀(CSV) 받기</button>
</div></div>
<div class="card" style="padding:0"><div class="tw" id="inq-tbl"></div></div>
</section>

<section class="panel" id="t-mem" hidden>
<div class="card"><div class="bar">
<div class="f"><label for="fm-mk">마케팅 수신</label><select id="fm-mk"><option value="">전체</option><option value="1">동의</option><option value="0">미동의</option></select></div>
<div class="f" style="flex:1 1 200px"><label for="fm-q">검색</label><input id="fm-q" type="search" placeholder="이름·이메일·전화번호"></div>
<button class="btn ghost" id="fm-csv" type="button">엑셀(CSV) 받기</button>
</div>
<p class="sub" style="margin:12px 0 0;line-height:1.6">광고 문자는 <b>마케팅 수신 동의</b> 회원에게만 보낼 수 있습니다. 문자 첫머리에 (광고), 끝에 수신거부 방법을 넣어야 하고, 밤 9시~아침 8시 발송은 별도 동의가 필요합니다.</p>
</div>
<div class="card" style="padding:0"><div class="tw" id="mem-tbl"></div></div>
</section>
</main>
</div>

<dialog id="dlg" aria-labelledby="dlg-h"><div class="dlg" id="dlg-b"></div></dialog>
<div class="toast" id="toast" role="status" hidden></div>

<script src="../js/config.js?v=9d256725"></script>
<script src="../js/academy-data.js?v=9d256725"></script>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.119.0/dist/umd/supabase.js"></script>
<script>
(function(){
var $=function(i){return document.getElementById(i)},C=window.SB_CONFIG||{},A=window.ACADEMY,sb=null,me=null;
var DATA={apps:[],inq:[],mem:[]};
var PLACE={'칸차나부리':'k','아마타':'a'};
var AST=['신청접수','결제안내','입금확인','예약확정','취소'],IST=['신규','연락완료','견적진행','계약','종료'];
function esc(s){return String(s==null?'':s).replace(/[&<>"']/g,function(c){return {'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]})}
function won(n){return (Number(n)||0).toLocaleString('ko-KR')+'원'}
function man(n){n=Number(n)||0;return n>=10000?(Math.round(n/1000)/10).toLocaleString('ko-KR')+'만원':won(n)}
function d8(s){if(!s)return '';var d=new Date(s);return (d.getMonth()+1)+'.'+String(d.getDate()).padStart(2,'0')+' '+String(d.getHours()).padStart(2,'0')+':'+String(d.getMinutes()).padStart(2,'0')}
function ymd(s){if(!s)return '';var d=new Date(s);return d.getFullYear()+'-'+String(d.getMonth()+1).padStart(2,'0')+'-'+String(d.getDate()).padStart(2,'0')}
function md(s){var p=s.split('-');return (+p[1])+'.'+(+p[2])}
function toast(t){var e=$('toast');e.textContent=t;e.hidden=false;clearTimeout(toast.t);toast.t=setTimeout(function(){e.hidden=true},2200)}
function sessOf(place,no){var k=PLACE[place];if(!k)return null;var x=A[k].s.filter(function(r){return r[0]===no})[0];return x?{k:k,cap:A[k].cap,no:x[0],s:x[1],e:x[2],nights:x[3],price:x[4],pros:x[5].split('·'),tag:k==='a'?x[6]:''}:null}
function csv(name,head,rows){var b='﻿'+[head].concat(rows).map(function(r){return r.map(function(v){v=v==null?'':String(v);if(/^[=+\-@]/.test(v))v="'"+v;return '"'+v.replace(/"/g,'""')+'"'}).join(',')}).join('\r\n');
 var a=document.createElement('a');a.href=URL.createObjectURL(new Blob([b],{type:'text/csv;charset=utf-8'}));a.download=name+'_'+ymd(new Date())+'.csv';a.click();setTimeout(function(){URL.revokeObjectURL(a.href)},1000)}
function errMsg(e){var m=(e&&e.message)||'';if(/Invalid login/i.test(m))return '이메일 또는 비밀번호가 맞지 않습니다.';if(/Email not confirmed/i.test(m))return '이메일 인증이 완료되지 않은 계정입니다.';return '오류: '+(m||'처리하지 못했습니다');}

/* ---------- 로그인 ---------- */
function show(id){['boot','login','app'].forEach(function(x){$(x).hidden=x!==id})}
if(!C.url||!C.key){$('boot').textContent='Supabase 연결 정보가 아직 설정되지 않았습니다. Ctrl+Shift+R로 새로고침해 보세요.';return}
if(!window.supabase){$('boot').textContent='로그인 모듈(cdn.jsdelivr.net)을 불러오지 못했습니다. 인터넷 연결이나 광고 차단 확장 프로그램을 확인한 뒤 새로고침해 주세요.';return}
sb=supabase.createClient(C.url,C.key);
function enter(user){return sb.rpc('is_admin').then(function(r){if(r.error||!r.data){return sb.auth.signOut().then(function(){show('login');var m=$('lg-m');m.textContent='관리자 권한이 없는 계정입니다.';m.hidden=false})}
 me=user;$('who').textContent=user.email;show('app');return loadAll()})}
sb.auth.getSession().then(function(r){var u=r.data.session&&r.data.session.user;if(u)return enter(u);show('login')});
$('login').querySelector('form').addEventListener('submit',function(e){e.preventDefault();var m=$('lg-m'),b=this.querySelector('button');m.hidden=true;b.disabled=true;
 sb.auth.signInWithPassword({email:$('lg-e').value.trim(),password:$('lg-p').value}).then(function(r){b.disabled=false;if(r.error){m.textContent=errMsg(r.error);m.hidden=false;return}return enter(r.data.user)})});
$('out').onclick=function(){sb.auth.signOut().then(function(){location.reload()})};

/* ---------- 데이터 ---------- */
function loadAll(){return Promise.all([
 sb.from('academy_applications').select('*').order('created_at',{ascending:false}).limit(5000),
 sb.from('inquiries').select('*').order('created_at',{ascending:false}).limit(5000),
 sb.from('profiles').select('*').order('created_at',{ascending:false}).limit(10000)
]).then(function(rs){var bad=rs.filter(function(r){return r.error})[0];if(bad){toast(errMsg(bad.error))}
 DATA.apps=rs[0].data||[];DATA.inq=rs[1].data||[];DATA.mem=rs[2].data||[];renderAll()})}
function renderAll(){var n=DATA.apps.filter(function(a){return a.status==='신청접수'}).length,m=DATA.inq.filter(function(a){return a.status==='신규'}).length;
 $('c-apps').textContent=n;$('c-apps').hidden=!n;$('c-inq').textContent=m;$('c-inq').hidden=!m;
 fillFilters();rDash();rApps();rSess();rInq();rMem()}

/* ---------- 탭 ---------- */
var tabs=[].slice.call(document.querySelectorAll('nav.tabs button'));
tabs.forEach(function(b){b.onclick=function(){tabs.forEach(function(x){x.setAttribute('aria-selected',x===b);$('t-'+x.dataset.t).hidden=x!==b});history.replaceState(null,'','#'+b.dataset.t)}});
var h=location.hash.slice(1);tabs.forEach(function(b){if(b.dataset.t===h)b.click()});
function go(t){tabs.filter(function(b){return b.dataset.t===t})[0].click();window.scrollTo(0,0)}

/* ---------- 대시보드 ---------- */
function active(a){return a.status!=='취소'}
function rDash(){var ap=DATA.apps,act=ap.filter(active);
 var paid=ap.reduce(function(s,a){return s+(a.paid_amount||0)},0);
 var conf=ap.filter(function(a){return a.status==='입금확인'||a.status==='예약확정'});
 var confSales=conf.reduce(function(s,a){return s+(a.total_won||0)},0);
 var pend=ap.filter(function(a){return a.status==='신청접수'||a.status==='결제안내'});
 var pendSales=pend.reduce(function(s,a){return s+(a.total_won||0)},0);
 var unpaid=conf.reduce(function(s,a){return s+Math.max(0,(a.total_won||0)-(a.paid_amount||0))},0);
 var ppl=act.reduce(function(s,a){return s+a.people},0);
 var newA=ap.filter(function(a){return a.status==='신청접수'}).length,payA=ap.filter(function(a){return a.status==='결제안내'}).length,newI=DATA.inq.filter(function(a){return a.status==='신규'}).length;
 var mk=DATA.mem.filter(function(m){return m.marketing_sms}).length;
 function kpi(l,v,s,t){return '<div class="kpi"'+(t?' style="cursor:pointer" data-go="'+t+'"':'')+'><span>'+l+'</span><b>'+v+'</b>'+(s?'<small>'+s+'</small>':'')+'</div>'}
 var rows=['칸차나부리','아마타'].map(function(pl){var x=ap.filter(function(a){return a.place===pl});
  function sum(f,k){return x.filter(f).reduce(function(s,a){return s+(a[k]||0)},0)}
  var c=function(a){return a.status==='입금확인'||a.status==='예약확정'},p=function(a){return a.status==='신청접수'||a.status==='결제안내'};
  return [pl,x.filter(active).length,sum(active,'people'),sum(c,'total_won'),sum(function(){return true},'paid_amount'),sum(p,'total_won')]});
 var tot=rows.reduce(function(t,r){return t.map(function(v,i){return i?v+r[i]:'합계'})},['',0,0,0,0,0]);
 $('t-dash').innerHTML='<div class="kpis">'+kpi('처리 대기 신청',newA+'건','결제 안내 문자를 보내야 할 신청','apps')+kpi('입금 대기',payA+'건','결제 안내 후 입금 전','apps')+kpi('새 행사 문의',newI+'건','','inq')+kpi('총 신청 인원',ppl+'명','취소 제외 · '+act.length+'건','sess')+'</div>'+
 '<div class="kpis">'+kpi('입금 합계',man(paid),won(paid))+kpi('확정 매출',man(confSales),'입금확인·예약확정 신청의 예상 금액')+kpi('잔금 미수',man(unpaid),'확정 신청 중 덜 들어온 금액')+kpi('대기 중 매출',man(pendSales),'신청접수·결제안내 단계')+kpi('회원',DATA.mem.length+'명','마케팅 수신 동의 '+mk+'명','mem')+'</div>'+

/* ---------- 회원 ---------- */
['fm-mk','fm-q'].forEach(function(i){$(i).addEventListener(i==='fm-q'?'input':'change',rMem)});
function filtMem(){var mk=$('fm-mk').value,q=$('fm-q').value.trim().replace(/-/g,'');return DATA.mem.filter(function(m){return(!mk||(m.marketing_sms?'1':'0')===mk)&&(!q||[m.name,m.email,m.phone].join(' ').replace(/-/g,'').indexOf(q)>=0)})}
function rMem(){var l=filtMem(),cnt={};DATA.apps.forEach(function(a){if(a.user_id)cnt[a.user_id]=(cnt[a.user_id]||0)+1});
 $('mem-tbl').innerHTML=!l.length?'<div class="empty">회원이 없습니다.</div>':'<table><thead><tr><th>가입일</th><th>이름</th><th>이메일</th><th>휴대폰</th><th class="num">신청</th><th>마케팅 수신</th><th>등급</th></tr></thead><tbody>'+l.map(function(m){return '<tr><td>'+ymd(m.created_at)+'</td><td><b>'+esc(m.name||'-')+'</b></td><td>'+esc(m.email||'')+'</td><td>'+esc(m.phone||'')+'</td><td class="num">'+(cnt[m.id]||0)+'건</td><td>'+(m.marketing_sms?'<span class="st" data-s="예약확정">동의</span> <span class="sub">'+ymd(m.marketing_agreed_at)+'</span>':'<span class="sub">미동의</span>')+'</td><td>'+(m.id===me.id?'<b>관리자 (나)</b>':'<select data-role="'+m.id+'" aria-label="'+esc(m.name||m.email)+' 등급"><option value="member"'+(m.role==='member'?' selected':'')+'>회원</option><option value="admin"'+(m.role==='admin'?' selected':'')+'>관리자</option></select>')+'</td></tr>'}).join('')+'</tbody></table>';
 $('mem-tbl').querySelectorAll('[data-role]').forEach(function(s){s.onchange=function(){var m=DATA.mem.filter(function(x){return x.id===s.dataset.role})[0],to=s.value;
  if(!confirm((m.name||m.email)+'님을 '+(to==='admin'?'관리자로 지정':'일반 회원으로 변경')+'할까요?'+(to==='admin'?'\n관리자는 모든 신청자·회원 정보를 보고 수정할 수 있습니다.':''))){s.value=m.role;return}
  sb.from('profiles').update({role:to}).eq('id',m.id).select().single().then(function(r){if(r.error){toast(errMsg(r.error));s.value=m.role;return}m.role=to;toast('변경했습니다')})}})}
$('fm-csv').onclick=function(){csv('회원',['가입일','이름','이메일','휴대폰','마케팅수신','동의일','등급'],filtMem().map(function(m){return [ymd(m.created_at),m.name,m.email,m.phone,m.marketing_sms?'동의':'미동의',ymd(m.marketing_agreed_at),m.role]}))};
})();
</script>
</body>
</html>
