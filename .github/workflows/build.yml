# src/ 원본이 바뀌어 main에 push되면, GitHub이 python3 src/build.py를 실행해
# 루트 HTML을 다시 만들고 자동으로 커밋합니다. (GitHub Pages는 그 커밋을 배포)
name: Build site

on:
  push:
    branches: [main]
    paths:
      - 'src/**'
      - '.github/workflows/build.yml'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: build-site
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Build
        run: python3 src/build.py
      - name: Commit generated files
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A -- . ':!src'
          if git diff --cached --quiet; then
            echo "변경 없음"
          else
            git commit -m "사이트 자동 빌드 (src 변경 반영)"
            git push
          fi
